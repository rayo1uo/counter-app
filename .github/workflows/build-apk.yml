name: Build Android debug APK

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不依赖 android-actions/setup-android（Node 20 action 在新版 runner 上会失败）。
      # 优先用 runner 预装的 Android SDK，缺失时才下载官方 commandline-tools。
      - name: Locate or install Android SDK
        working-directory: counter-app/android
        run: |
          set -eu
          : > build.log
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SM=""
          if [ -n "$SDK" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SM="$(command -v sdkmanager)"
          fi
          if [ -z "$SM" ]; then
            echo "No preinstalled sdkmanager, downloading Android commandline-tools" | tee -a build.log
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SM" >> "$GITHUB_ENV"
          echo "SDK=$SDK" | tee -a build.log
          echo "SDKMANAGER=$SM" | tee -a build.log
          "$SM" --version 2>&1 | tee -a build.log

      - name: Accept SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: |
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tee -a counter-app/android/build.log

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: counter-app/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest lintDebug --stacktrace --no-daemon 2>&1 | tee -a build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: counter-debug-apk
          path: counter-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: counter-test-apk
          path: counter-app/android/app/build/outputs/apk/androidTest/debug/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: counter-app/android/build.log
          if-no-files-found: warn

      # 失败时把编译错误写进 Annotations / Step Summary（无需 token 即可查看）。
      - name: Report failure details
        if: failure()
        run: |
          LOG=counter-app/android/build.log
          grep -E '^e: |error:|FAILURE:|What went wrong|Caused by:|^\* Try|No preinstalled|sdkmanager|Exception' "$LOG" 2>/dev/null | tail -n 30 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | while IFS= read -r line; do echo "::error::$line"; done || true
          {
            echo '## Build failed — build.log tail'
            echo '```text'
            tail -n 60 "$LOG" 2>/dev/null || echo '(no build.log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
